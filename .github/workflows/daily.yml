name: 每日选题推送

on:
  # 定时任务已暂停（2026-08-06 暂停），想恢复时取消下面三行注释即可
  # schedule:
  #   # 北京时间早上 6:00 (UTC 22:00)，预留延迟余量
  #   - cron: "0 22 * * *"
  workflow_dispatch:  # 保留手动触发，暂停期间想跑可以手动运行

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行选题生成
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL || 'https://api.deepseek.com' }}
          OUTPUT_DIR: ${{ github.workspace }}
        run: python main.py

      - name: 提交并推送
        run: |
          git config user.name "topic-bot"
          git config user.email "bot@topic-pusher.local"
          git add *.md
          if git diff --staged --quiet; then
            echo "没有新文件，跳过提交"
          else
            git commit -m "📰 $(date +%Y%m%d) 选题素材"
            git push
          fi
